name: Code quality

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Setup Biome
        uses: biomejs/setup-biome@v2
        with:
          # Keep in sync with the @biomejs/biome devDependency. `latest` picks up
          # new rule names and schema versions that the committed biome.json
          # does not know about, which fails the job on configuration alone.
          version: 2.5.14
      - name: Run Biome
        run: biome ci .
